backend:
  name: github
  repo: maisondela/website
  branch: main

media_folder: uploads
public_folder: /uploads

locale: fr

collections:
  - name: articles
    label: Actualités
    label_singular: Article
    folder: content/articles
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: date, label: Date de publication, widget: datetime }
      - { name: image, label: Image de couverture, widget: image, required: false }
      - { name: body, label: Contenu, widget: markdown }

  - name: events
    label: Agenda
    label_singular: Événement
    folder: content/events
    create: true
    slug: "{{fields.date}}-{{slug}}"
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: date, label: Date et heure, widget: datetime }
      - { name: location, label: Lieu, widget: string }
      - { name: body, label: Description, widget: markdown }

  - name: offerings
    label: Propositions artistiques
    label_singular: Proposition
    folder: content/offerings
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Titre, widget: string }
      - { name: summary, label: Résumé (une phrase), widget: text }
      - { name: price, label: Tarif, widget: string }
      - { name: order, label: Ordre d'affichage, widget: number, value_type: int }
      - { name: body, label: Description, widget: markdown }

  - name: creatures
    label: Les Créatures
    label_singular: Créature
    folder: content/creatures
    create: true
    slug: "{{slug}}"
    fields:
      - { name: name, label: Nom de la Créature, widget: string, required: false }
      - { name: order, label: Ordre d'affichage, widget: number, value_type: int }
      - name: mono
        label: Portrait noir et blanc
        widget: image
        media_folder: /media/portraits/mono
        public_folder: /media/portraits/mono
      - name: color
        label: Portrait couleur (révélé au survol)
        widget: image
        media_folder: /media/portraits/color
        public_folder: /media/portraits/color

  - name: settings
    label: Paramètres du site
    files:
      - name: association
        label: Informations de l'association
        file: content/data/association.json
        fields:
          - { name: name, label: Nom de l'association, widget: string }
          - { name: description, label: Description courte, widget: text }
          - { name: address, label: Adresse, widget: text }
          - { name: email, label: Email de contact, widget: string }
      - name: homepage
        label: Page d'accueil
        file: content/data/homepage.json
        fields:
          - name: hero_image
            label: Image du bandeau d'accueil
            widget: image
            media_folder: /media/artwork
            public_folder: /media/artwork
          - { name: hero_tagline, label: Phrase d'accroche, widget: text }
          - { name: booking_title, label: Bandeau programmateurices — titre, widget: string }
          - { name: booking_text, label: Bandeau programmateurices — texte, widget: text }
      - name: house
        label: Page La Maison De La
        file: content/data/house.json
        fields:
          - { name: vision, label: Vision, widget: markdown, required: false }
          - { name: operations, label: Fonctionnement, widget: markdown, required: false }
          - { name: values, label: Valeurs, widget: markdown, required: false }
          - { name: charter, label: Charte, widget: markdown, required: false }
      - name: gallery
        label: Galerie
        file: content/data/gallery.json
        fields:
          - name: images
            label: Images
            widget: list
            fields:
              - name: image
                label: Image
                widget: image
                media_folder: /media/artwork
                public_folder: /media/artwork
              - { name: caption, label: Légende, widget: string, required: false }
